name: Spaced Repetition Scheduler

on:
  schedule:
    # 07:00, 13:00, 20:00 Bangkok Time (UTC+7)
    # Equals 00:00, 06:00, 13:00 UTC
    - cron: '0 0,6,13 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  sync:
    name: Sync NotebookLM & Todoist
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Spaced Repetition Sync
        env:
          TODOIST_API_TOKEN: ${{ secrets.TODOIST_API_TOKEN }}
        run: |
          python sync_todoist.py

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add schedule.json
          if ! git diff --staged --quiet; then
            echo "Changes detected in schedule.json. Committing and pushing..."
            git commit -m "chore(sync): update spaced repetition schedule [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin ${{ github.ref_name }}
          else
            echo "No changes in schedule.json to commit."
          fi
